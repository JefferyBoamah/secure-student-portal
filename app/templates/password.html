{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  {% if errors %}<ul class="flash error">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label><span>Current password</span><div class="pw"><input type="password" name="current_password" required maxlength="128" autocomplete="current-password"><button type="button" class="pw-toggle" data-toggle-password>Show</button></div></label>
    <label><span>New password</span><div class="pw"><input type="password" name="new_password" required maxlength="128" autocomplete="new-password"><button type="button" class="pw-toggle" data-toggle-password>Show</button></div></label>
    <label><span>Repeat new password</span><div class="pw"><input type="password" name="new_password2" required maxlength="128" autocomplete="new-password"><button type="button" class="pw-toggle" data-toggle-password>Show</button></div></label>
    <button type="submit">Update password</button>
  </form>
</section>
{% endblock %}
