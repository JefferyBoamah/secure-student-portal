{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change password</h1>
  {% if errors %}<ul class="flash error">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password <input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label>
    <label>New password <input type="password" name="new_password" required maxlength="128" autocomplete="new-password"></label>
    <label>Repeat new password <input type="password" name="new_password2" required maxlength="128" autocomplete="new-password"></label>
    <button type="submit">Update password</button>
  </form>
</section>
{% endblock %}
