{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" required maxlength="40" autofocus></label>
    <label>Password <input type="password" name="password" required maxlength="128" autocomplete="current-password"></label>
    <button type="submit">Continue</button>
  </form>
  <p class="hint">Next step: a 6-digit code from your authenticator app.</p>
</section>
{% endblock %}
