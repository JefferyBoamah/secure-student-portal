# /etc/fail2ban/filter.d/portal.conf
# Bans IP addresses that keep triggering security events recorded in instance/security.log
# Log line example:  2026-11-12 10:21:07,123 INFO event=login_failed user=4 ip=203.0.113.9 detail=wrong password

[Definition]
failregex = event=(login_failed|login_blocked|mfa_failed|rate_limited|webhook_rejected|bad_host_header|csrf_failed|jwt_rejected|idor_blocked) user=\S+ ip=<HOST>
ignoreregex =

# ----------------------------------------------------------------------------
# /etc/fail2ban/jail.d/portal.local  (copy the block below into that file)
#
# [portal]
# enabled  = true
# filter   = portal
# logpath  = /opt/secure-student-portal/instance/security.log
# port     = http,https
# maxretry = 15
# findtime = 600
# bantime  = 3600
# action   = ufw
