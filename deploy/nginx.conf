# Nginx reverse proxy: the LAN-to-WAN security perimeter in front of the Flask application.
# Install as /etc/nginx/sites-available/portal and symlink into sites-enabled.
# Replace portal.example.edu and the certificate paths (for example from Let's Encrypt / certbot).
#
# The app runs behind it with:   PORTAL_BEHIND_PROXY=1 PORTAL_ALLOWED_HOSTS=portal.example.edu \
#                                gunicorn -w 4 -b 127.0.0.1:8000 "app:create_app()"

# ---- rate-limit zones (http context) ----
limit_req_zone  $binary_remote_addr zone=general:10m  rate=10r/s;     # normal browsing
limit_req_zone  $binary_remote_addr zone=login:10m    rate=5r/m;      # brute force / credential stuffing
limit_req_zone  $binary_remote_addr zone=api:10m      rate=30r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;                   # concurrent connections per IP

server_tokens off;                                                    # no nginx version in headers or error pages

# ---- plain HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    server_name portal.example.edu;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    server_name portal.example.edu;

    # Transport security (defeats downgrade and man-in-the-middle attacks)
    ssl_certificate     /etc/letsencrypt/live/portal.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.edu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Slow-client (slowloris) and oversized-request protection
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;
    client_max_body_size  64k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    limit_conn perip 20;

    # Only the methods this app uses
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    # Never reveal the upstream framework banner (the app sets its own neutral one)
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # Block access to hidden files and source/backup files
    location ~ /\.            { deny all; return 404; }
    location ~* \.(py|db|sqlite|log|bak|env|ini|cfg)$ { deny all; return 404; }

    # Brute-force protection on the credential endpoints
    location ~ ^/(login|mfa/verify|mfa/setup|register|account/password)$ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/portal-proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/portal-proxy.conf;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/portal-proxy.conf;
    }
}

# ---- /etc/nginx/snippets/portal-proxy.conf ----
